name: Hatena Draft Article Generator (Yahoo Research)

on:
  schedule:
    # 毎日定期的に下書きストックを自動生成（例: 1日3回 09:00, 15:00, 21:00 JST）
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      target_genre:
        description: '対象ジャンル・ブログ（mono: ガジェット, mikke: ホビー, book: 書籍）'
        required: true
        default: 'mono'
        type: choice
        options:
        - mono
        - mikke
        - book
      search_query:
        description: '検索キーワード（空欄なら人気・売れ筋ワードから自動選定）'
        required: false
        default: ''

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Draft Poster
      env:
        # Yahoo API Credentials
        YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}

        # Hatena API Credentials
        HATENA_ID: ${{ secrets.HATENA_ID }}
        HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
        HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}

        # AI Credentials
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        # Options
        TARGET_GENRE: ${{ github.event.inputs.target_genre || 'mono' }}
        SEARCH_QUERY: ${{ github.event.inputs.search_query || '' }}
      run: |
        python draft_poster.py

    - name: Commit and push draft cache
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add draft_cache.txt || true
        if ! git diff --cached --quiet; then
          git commit -m "chore: update draft cache [skip ci]"
          git pull --rebase origin main || true
          git push origin main || true
        else
          echo "No cache updates."
        fi
